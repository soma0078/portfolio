<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-SHPB7SXZ0T"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-SHPB7SXZ0T", { send_page_view: false });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="naver-site-verification" content="e8660be44a1b8c7b5b9873223dfdcc857bfc4963" />
    <!--
      다크모드를 첫 페인트 전에 확정한다. React가 마운트된 뒤에 클래스를 붙이면
      다크 사용자가 흰 화면을 한 번 보고 지나간다. 규칙은 Tailwind 공식 문서의
      "With system theme support"와 동일하다.
    -->
    <script>
      document.documentElement.classList.toggle(
        "dark",
        localStorage.theme === "dark" ||
          (!("theme" in localStorage) &&
            window.matchMedia("(prefers-color-scheme: dark)").matches),
      );
    </script>
    <meta
      name="description"
      content="프론트엔드 개발자 이송아입니다. UI/UX 기획 · 디자인 경력을 바탕으로 사용자 웹 서비스와 어드민을 개발해 왔습니다."
    />
