<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="AI 에이전트 목록 화면 구조도. 4대 3 비율의 화면 안에 헤더와 사이드바가 있고, 검색과 카테고리 칩 아래에 제목이 붙은 두 개의 카드 줄과 줄마다 좌우 슬라이드 화살표가 있다">
  <!--
    인턴 기간에 구현한 AI 에이전트 목록 화면을 그린 판이다.
    화면은 4:3 가로 비율(680 x 510)로 두고, 세로 카드에서 잘리지 않도록 판 가운데에 놓았다.
    구성은 헤더 · 사이드바 · 검색 · 카테고리 칩 · 제목을 단 카드 줄 두 개(각 4열)다.

    화살표는 카드 위에 겹치지 않는다 — 본문 좌우에 28px씩 자리를 비워 두고 그 안에 놓았다.
    색은 이 경력 카드의 색(#2c5a55)에서 가져왔다.
  -->
  <rect width="800" height="1000" fill="#eceee9"/>

  <!-- 화면 · 4:3 -->
  <rect x="60" y="245" width="680" height="510" rx="24" fill="#ffffff"/>

  <!-- 헤더 -->
  <rect x="88" y="269" width="100" height="12" rx="6" fill="#2c5a55"/>
  <circle cx="706" cy="275" r="12" fill="#dfe4e0"/>

  <!-- 사이드바 -->
  <rect x="88" y="305" width="120" height="420" rx="14" fill="#f2f4f2"/>
