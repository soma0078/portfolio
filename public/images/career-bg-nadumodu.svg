  <rect x="419" y="557" width="98" height="12" rx="6" fill="#b9c2bd"/>

  <rect x="262" y="577" width="95" height="130" rx="12" fill="#f7f8f7"/>
  <circle cx="288" cy="607" r="15" fill="#7fb3a8"/>
