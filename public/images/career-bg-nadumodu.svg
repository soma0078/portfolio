  <rect x="386" y="351" width="68" height="22" rx="11" fill="#eef1ef"/>
  <rect x="464" y="351" width="84" height="22" rx="11" fill="#eef1ef"/>

  <!-- ─────────── 1행: 제목 + 카드 4장 ─────────── -->
