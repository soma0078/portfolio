  <rect x="591" y="679" width="67" height="16" rx="8" fill="#eef1ef"/>

  <!-- 2행 슬라이드 화살표 · 카드 바깥 여백에 -->
  <circle cx="238" cy="642" r="14" fill="#f2f4f2"/>
  <path d="M241 637 L236 642 L241 647" fill="none" stroke="#6f8c86" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="698" cy="642" r="14" fill="#f2f4f2"/>
  <path d="M695 637 L700 642 L695 647" fill="none" stroke="#6f8c86" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
