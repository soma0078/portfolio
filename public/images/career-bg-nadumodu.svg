  <!-- 검색 -->
  <rect x="224" y="305" width="488" height="34" rx="17" fill="#f2f4f2"/>
  <circle cx="250" cy="320" r="8" fill="none" stroke="#b9c2bd" stroke-width="3"/>
  <path d="M256 326 L263 333" stroke="#b9c2bd" stroke-width="3" stroke-linecap="round"/>
  <rect x="278" y="318" width="130" height="8" rx="4" fill="#cfd6d2"/>

  <!-- 카테고리 칩 -->
  <rect x="224" y="351" width="64" height="22" rx="11" fill="#2c5a55"/>
